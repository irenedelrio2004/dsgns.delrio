<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="images/logo.webp" type="image/webp" />
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&family=Albert+Sans:wght@200;300;400&family=Gilda+Display&display=swap"
        />
        <link
          rel="stylesheet"
          href="_ds/nocturne-ec3a2124-2df5-42f4-9fc8-09e24e9696db/styles.css"
        />
        <script src="_ds/nocturne-ec3a2124-2df5-42f4-9fc8-09e24e9696db/_ds_bundle.js"></script>
        <script src="./image-slot.js"></script>
        <style>
          html {
            background: #000;
          }
          body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: "Montserrat", sans-serif;
          }
          a {
            color: #fff;
            text-decoration: none;
          }
          a:hover {
            color: #bdbdbd;
          }
          ::selection {
            background: #fff;
            color: #000;
          }

          .desktop-nav {
            display: flex;
          }
          .mobile-menu {
            display: none;
          }
          .menu-toggle {
            display: none;
          }
          .mobile-nav {
            display: none;
          }

          @media (max-width: 760px) {
            header {
              flex-wrap: wrap;
              row-gap: 12px;
            }
            .desktop-nav {
              display: none !important;
            }
            .mobile-menu {
              display: block;
              width: 100%;
              margin-left: 0;
              position: relative;
              z-index: 51;
            }
            .mobile-menu summary {
              list-style: none;
              cursor: pointer;
              display: inline-flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              gap: 4px;
              width: 24px;
              height: 24px;
              background: transparent;
              border: 0;
              padding: 0;
              margin-left: auto;
            }
            .mobile-menu summary::-webkit-details-marker {
              display: none;
            }
            .menu-bar {
              display: block;
              width: 18px;
              height: 1.5px;
              background: #fff;
              border-radius: 2px;
              transition:
                transform 0.25s ease,
                opacity 0.25s ease;
            }
            .mobile-menu[open] .menu-bar:nth-child(1) {
              transform: translateY(5.5px) rotate(45deg);
            }
            .mobile-menu[open] .menu-bar:nth-child(2) {
              opacity: 0;
            }
            .mobile-menu[open] .menu-bar:nth-child(3) {
              transform: translateY(-5.5px) rotate(-45deg);
            }
            header:has(.mobile-menu[open]) .brand-name {
              display: none;
            }
            .mobile-nav {
              display: none;
              width: 100%;
              flex-direction: column;
              align-items: flex-start;
              gap: 16px;
              padding: 0 0 20px;
              background: #000;
              position: relative;
              z-index: 50;
            }
            .mobile-menu[open] .mobile-nav {
              display: flex;
            }
            .mobile-nav a {
              display: block;
              width: 100%;
              text-align: left;
              font-size: 12px;
              letter-spacing: 0.14em;
              color: #f4f4f4;
              padding: 4px 0;
            }
          }
        </style>
      </helmet>

      <div
        style="
          background: #000;
          color: #fff;
          font-family: &quot;Montserrat&quot;, sans-serif;
          text-transform: uppercase;
          overflow-x: clip;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
        "
      >
        <header
          style="
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 22px 3.5vw;
            background: #000;
          "
        >
          <a
            class="brand-name"
            href="index.html"
            style="
              font-size: max(12px, 0.85vw);
              letter-spacing: 0.14em;
              font-weight: 400;
              color: #fff;
              transition: opacity 0.25s ease;
            "
            style-hover="opacity:.55"
            >DSGNS.DELRIO</a
          >
          <details class="mobile-menu">
            <summary class="menu-toggle" aria-label="Abrir menú">
              <span class="menu-bar"></span>
              <span class="menu-bar"></span>
              <span class="menu-bar"></span>
            </summary>
            <nav class="mobile-nav" aria-label="Menú móvil">
              <a href="Sobre%20mi.dc.html">{{ navAbout }}</a>
              <a href="#proyectos">{{ navWork }}</a>
            </nav>
          </details>
          <nav
            class="desktop-nav"
            style="
              display: flex;
              align-items: center;
              gap: clamp(28px, 5vw, 72px);
              font-size: clamp(10px, 0.8vw, 15px);
              letter-spacing: 0.14em;
              color: #b9b9b9;
              margin-left: clamp(18px, 2vw, 32px);
            "
          >
            <a
              href="Sobre%20mi.dc.html"
              style="
                color: #b9b9b9;
                transition: color 0.25s ease;
                padding: 8px 0;
              "
              style-hover="color:#fff"
              >{{ navAbout }}</a
            >
            <a
              href="#proyectos"
              style="color: #fff; transition: color 0.25s ease; padding: 8px 0"
              style-hover="color:#fff"
              >{{ navWork }}</a
            >
          </nav>
        </header>

        <main
          id="proyectos"
          style="
            flex: 1;
            width: 100%;
            padding: clamp(28px, 5vw, 80px) 3.5vw clamp(140px, 22vh, 280px);
            box-sizing: border-box;
          "
        >
          <h1
            style="
              margin: 0 0 clamp(40px, 6vw, 96px);
              font-family: &quot;Albert Sans&quot;, sans-serif;
              font-weight: 300;
              letter-spacing: 0.01em;
              line-height: 1.04;
              font-size: max(28px, 5vw);
              text-align: center;
              white-space: nowrap;
            "
          >
            {{ pageTitle }}
          </h1>

          <div
            style="
              display: flex;
              flex-direction: column;
              gap: clamp(36px, 6vw, 96px);
            "
          >
            <a
              id="tfg"
              href="Trabajo%20de%20fin%20de%20grado.dc.html"
              style="
                display: flex;
                flex-direction: column;
                gap: clamp(14px, 1.8vw, 26px);
                color: #fff;
                scroll-margin-top: 90px;
              "
            >
              <span
                style="
                  font-weight: 300;
                  font-size: max(13px, 1.45vw);
                  letter-spacing: 0.04em;
                "
                >{{ p1 }}</span
              >
              <image-slot
                id="proy-tfg"
                shape="rect"
                fit="cover"
                src="./images/tfg.png"
                style="
                  width: 100%;
                  aspect-ratio: 2.05/1;
                  transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
                "
                placeholder="Trabajo de fin de grado"
                style-hover="transform:scale(1.03)"
              ></image-slot>
            </a>

            <a
              id="tresd"
              href="3D.dc.html"
              style="
                display: flex;
                flex-direction: column;
                gap: clamp(14px, 1.8vw, 26px);
                color: #fff;
                scroll-margin-top: 90px;
              "
            >
              <span
                style="
                  font-weight: 300;
                  font-size: max(13px, 1.45vw);
                  letter-spacing: 0.04em;
                "
                >{{ p2 }}</span
              >
              <image-slot
                id="proy-3d"
                shape="rect"
                fit="cover"
                src="./images/3d.jpg"
                style="
                  width: 100%;
                  aspect-ratio: 2.05/1;
                  transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
                "
                placeholder="3D"
                style-hover="transform:scale(1.03)"
              ></image-slot>
            </a>

            <a
              id="audiovisual"
              href="Contenido%20audiovisual.dc.html"
              style="
                display: flex;
                flex-direction: column;
                gap: clamp(14px, 1.8vw, 26px);
                color: #fff;
                scroll-margin-top: 90px;
              "
            >
              <span
                style="
                  font-weight: 300;
                  font-size: max(13px, 1.45vw);
                  letter-spacing: 0.04em;
                "
                >{{ p3 }}</span
              >
              <image-slot
                id="proy-audiovisual"
                shape="rect"
                fit="cover"
                zoom="1"
                pan-y="0"
                src="./images/berlin.png"
                style="
                  width: 100%;
                  aspect-ratio: 2.05/1;
                  transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
                "
                placeholder="Contenido audiovisual"
                style-hover="transform:scale(1.03)"
              ></image-slot>
            </a>

            <a
              id="otros"
              href="Otros%20proyectos.dc.html"
              style="
                display: flex;
                flex-direction: column;
                gap: clamp(14px, 1.8vw, 26px);
                color: #fff;
                scroll-margin-top: 90px;
              "
            >
              <span
                style="
                  font-weight: 300;
                  font-size: max(13px, 1.45vw);
                  letter-spacing: 0.04em;
                "
                >{{ p4 }}</span
              >
              <image-slot
                id="proy-otros"
                shape="rect"
                fit="cover"
                src="./images/cajas.jpg"
                style="
                  width: 100%;
                  aspect-ratio: 2.05/1;
                  transition: transform 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
                "
                placeholder="Otros proyectos"
                style-hover="transform:scale(1.03)"
              ></image-slot>
            </a>
          </div>
        </main>

        <footer
          style="
            background: #e9e9e9;
            color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: clamp(16px, 2.4vw, 32px);
            padding: clamp(36px, 5vw, 80px) 3.5vw clamp(28px, 3.5vw, 56px);
            font-family: &quot;Gilda Display&quot;, serif;
          "
        >
          <div
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 18px;
            "
          >
            <div
              style="
                display: flex;
                align-items: center;
                gap: clamp(4px, 0.6vw, 10px);
              "
            >
              <img
                src="images/logo.webp"
                alt="DSGNS.DELRIO"
                style="display: block; height: max(26px, 4.8vw); width: auto"
              />
              <span
                style="
                  font-weight: 400;
                  letter-spacing: 0.01em;
                  font-size: max(22px, 4vw);
                  line-height: 1;
                  color: #111;
                "
                >DSGNS.DELRIO</span
              >
            </div>
            <nav
              style="
                display: flex;
                gap: clamp(18px, 3vw, 44px);
                font-family: &quot;Montserrat&quot;, sans-serif;
                font-size: max(12px, 0.95vw);
                letter-spacing: 0.04em;
                text-transform: none;
                color: #333;
              "
            >
              <a
                href="https://www.instagram.com/dsgns.delrio/"
                target="_blank"
                rel="noopener noreferrer"
                style="color: #333; transition: color 0.25s ease"
                style-hover="color:#000"
                >Instagram</a
              >
              <a
                href="https://www.tiktok.com/@dsgns.delrio"
                target="_blank"
                rel="noopener noreferrer"
                style="color: #333; transition: color 0.25s ease"
                style-hover="color:#000"
                >TikTok</a
              >
              <a
                href="https://www.linkedin.com/in/irene-del-r%C3%ADo-174784340/"
                target="_blank"
                rel="noopener noreferrer"
                style="color: #333; transition: color 0.25s ease"
                style-hover="color:#000"
                >Linkedin</a
              >
            </nav>
          </div>
          <a
            href="mailto:irenerio2004@gmail.com"
            style="
              font-family: &quot;Montserrat&quot;, sans-serif;
              font-size: max(13px, 1.3vw);
              letter-spacing: 0.04em;
              font-weight: 400;
              color: #111;
              transition: opacity 0.25s ease;
            "
            style-hover="opacity:.55"
            >IRENERIO2004@GMAIL.COM</a
          >
          <div
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 8px;
              font-family: &quot;Montserrat&quot;, sans-serif;
              font-size: max(12px, 0.95vw);
              letter-spacing: 0.06em;
              color: #6b6b6b;
            "
          >
            <button
              type="button"
              onClick="{{ setEs }}"
              style="border:0;background:none;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:uppercase;color:{{ esColor }}"
            >
              ES
            </button>
            <span>/</span>
            <button
              type="button"
              onClick="{{ setEn }}"
              style="border:0;background:none;padding:0;cursor:pointer;font:inherit;letter-spacing:inherit;text-transform:uppercase;color:{{ enColor }}"
            >
              IN
            </button>
          </div>
        </footer>
      </div>
    </x-dc>
    <script>
      function toggleMobileMenu(button, menuId) {
        const menu = document.getElementById(menuId);
        if (!menu) return;

        const isOpen = button.getAttribute("aria-expanded") === "true";
        const nextState = !isOpen;
        button.setAttribute("aria-expanded", String(nextState));
        menu.classList.toggle("open", nextState);
      }
    </script>
    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"defaultLang":{"editor":"enum","options":["ES","EN"],"default":"ES","tsType":"string"}}'
    >
      const COPY = {
        ES: {
          navAbout: "SOBRE MI",
          navWork: "PROYECTOS",
          pageTitle: "PROYECTOS",
          p1: "TRABAJO DE FIN DE GRADO",
          p2: "3D",
          p3: "CONTENIDO AUDIOVISUAL",
          p4: "OTROS PROYECTOS"
        },
        EN: {
          navAbout: "ABOUT ME",
          navWork: "PROJECTS",
          pageTitle: "PROJECTS",
          p1: "FINAL DEGREE PROJECT",
          p2: "3D",
          p3: "AUDIOVISUAL CONTENT",
          p4: "OTHER PROJECTS"
        }
      };

      class Component extends DCLogic {
        state = { lang: this.props.defaultLang === "EN" ? "EN" : "ES" };

        renderVals() {
          return {
            ...COPY[this.state.lang],
            esColor: this.state.lang === "ES" ? "#111" : "#8d8d8d",
            enColor: this.state.lang === "EN" ? "#111" : "#8d8d8d",
            setEs: () => this.setState({ lang: "ES" }),
            setEn: () => this.setState({ lang: "EN" })
          };
        }
      }
    </script>
  </body>
</html>
