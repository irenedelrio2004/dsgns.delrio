    <script
      type="text/x-dc"
      data-dc-script
      data-props='{"defaultLang":{"editor":"enum","options":["ES","EN"],"default":"ES","tsType":"string"},"cardGap":{"editor":"int","default":18,"min":4,"max":50,"unit":"‰ del ancho","tsType":"number"}}'
    >
      const COPY = {
        ES: {
          navAbout: "SOBRE MI",
          navWork: "PROYECTOS",
          heroLine1: "HOLA, SOY",
          heroLine2: "DSGNS.DELRIO",
          bio: "ME LLAMO IRENE DEL RÍO ROMO, TENGO 22 AÑOS Y ACABO DE TERMINAR LA CARRERA DE DISEÑO GRÁFICO Y MULTIMEDIA EN LA UNIVERSIDAD UDIT DE MADRID. ACTUALMENTE ESTOY HACIENDO EL MASTER DE MOTION GRAPHICS EN VOXEL SCHOOL.",
          cta: "SABER MÁS SOBRE MI",
          p1: "TRABAJO DE FIN DE GRADO",
          p2: "3D",
          p3: "CONTENIDO AUDIOVISUAL",
          p4: "OTROS PROYECTOS"
        },
        EN: {
          navAbout: "ABOUT ME",
          navWork: "PROJECTS",
          heroLine1: "HI, I'M",
          heroLine2: "DSGNS.DELRIO",
          bio: "MY NAME IS IRENE DEL RÍO ROMO, I'M 22 AND I HAVE JUST FINISHED MY DEGREE IN GRAPHIC DESIGN AND MULTIMEDIA AT UDIT UNIVERSITY IN MADRID. I AM CURRENTLY TAKING THE MOTION GRAPHICS MASTER AT VOXEL SCHOOL.",
          cta: "MORE ABOUT ME",
          p1: "FINAL DEGREE PROJECT",
          p2: "3D",
          p3: "AUDIOVISUAL CONTENT",
          p4: "OTHER PROJECTS"
        }
      };

      const STACK = [
        { dx: -0.13, dy: -0.06, rot: -9 },
        { dx: 0.11, dy: -0.15, rot: 7 },
        { dx: 0.00, dy: 0.06, rot: -3 },
        { dx: 0.20, dy: 0.01, rot: 13 }
      ];

      class Component extends DCLogic {
        constructor(props) {
          super(props);
          this.state = { lang: props.defaultLang === "EN" ? "EN" : "ES" };
          this.trackRef = React.createRef();
          this.stageRef = React.createRef();
          this.cards = [React.createRef(), React.createRef(), React.createRef(), React.createRef()];
          this.onScroll = this.onScroll.bind(this);
        }

        componentDidMount() {
          this.frame = null;
          window.addEventListener("scroll", this.onScroll, { passive: true });
          window.addEventListener("resize", this.onScroll);
          this.layout();
        }

        componentWillUnmount() {
          window.removeEventListener("scroll", this.onScroll);
          window.removeEventListener("resize", this.onScroll);
          if (this.frame) cancelAnimationFrame(this.frame);
        }

        onScroll() {
          if (this.frame) return;
          this.frame = requestAnimationFrame(() => {
            this.frame = null;
            this.layout();
          });
        }

        layout() {
          const track = this.trackRef.current, stage = this.stageRef.current;
          if (!track || !stage) return;
          const rect = track.getBoundingClientRect();
          const span = Math.max(1, rect.height - window.innerHeight);
          const raw = Math.min(1, Math.max(0, -rect.top / span));
          const p = raw * raw * (3 - 2 * raw);

          const W = stage.clientWidth, H = stage.clientHeight;
          const ratio = 1.38;
          const gap = Math.max(10, W * (Number(this.props.cardGap ?? 18) / 1000));

          // narrow screens fold the final row into a 2x2 grid
          const cols = W < 780 ? 2 : 4;
          const rows = 4 / cols;
          let endW = (W * (cols === 2 ? 0.74 : 0.86) - (cols - 1) * gap) / cols;
          endW = Math.max(40, Math.min(endW, (H * (cols === 2 ? 0.26 : 0.40)) / ratio));
          const endH = endW * ratio;

          const startW = Math.min(W * (W < 780 ? 0.56 : 0.42), (H * 0.52) / ratio);
          const startH = startW * ratio;

          const startCY = H * 0.56, endCY = H * (cols === 2 ? 0.66 : 0.78);
          const rowW = cols * endW + (cols - 1) * gap;

          for (let i = 0; i < 4; i++) {
            const el = this.cards[i].current;
            if (!el) continue;
            const s = STACK[i];
            const w = startW + (endW - startW) * p;
            const h = startH + (endH - startH) * p;
            const sx = s.dx * startW, sy = s.dy * startH;
            const slot = 3 - i;
            const col = slot % cols, row = Math.floor(slot / cols);
            const ex = -rowW / 2 + col * (endW + gap) + endW / 2;
            const ey = endCY + (row - (rows - 1) / 2) * (endH + gap);
            const x = sx + (ex - sx) * p;
            const y = (startCY + sy) + (ey - (startCY + sy)) * p;
            const rot = s.rot * (1 - p);
            el.style.width = w + "px";
            el.style.height = h + "px";
            el.style.top = "0px";
            el.style.transform = "translate(-50%,-50%) translate(" + x + "px," + y + "px) rotate(" + rot + "deg)";
          }
        }

        componentDidUpdate() { this.layout(); }

        renderVals() {
          const t = COPY[this.state.lang];
          return {
            ...t,
            trackRef: this.trackRef,
            stageRef: this.stageRef,
            card0: this.cards[0],
            card1: this.cards[1],
            card2: this.cards[2],
            card3: this.cards[3],
            esColor: this.state.lang === "ES" ? "#111" : "#8d8d8d",
            enColor: this.state.lang === "EN" ? "#111" : "#8d8d8d",
            setEs: () => this.setState({ lang: "ES" }),
            setEn: () => this.setState({ lang: "EN" })
          };
        }
      }
    </script>
